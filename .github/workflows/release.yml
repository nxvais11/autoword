name: Testar e publicar Condomínio Fácil

on:
  push:
    branches: [main]
    paths:
      - 'CondominioFacil/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: condominio-facil-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Preparar dependências
        run: python -m pip install -r CondominioFacil/requirements.txt
      - name: Verificar regras e atualização
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s CondominioFacil/tests -v
      - name: Verificar sintaxe do OCR do Windows
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'CondominioFacil/pdf_ocr.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Verificar pacote sem dados de condomínios
        run: python scripts/build_release.py --output dist/CondominioFacil.zip

  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Montar e publicar versão numerada automaticamente
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: python scripts/publish_release.py
